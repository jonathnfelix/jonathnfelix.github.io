<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SplitEase Demo</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: #111;
            color: white;
            font-family: Georgia, 'Times New Roman', Times, serif;
        }

        .demo-container {
            width: 90%;
            max-width: 1000px;
            margin: 50px auto;
            text-align: center;
        }

        .demo-container h1 {
            margin-bottom: 10px;
        }

        .demo-container p {
            margin-bottom: 30px;
            color: #ddd;
        }

        video {
            width: 100%;
            max-width: 900px;
            border-radius: 10px;
            display: block;
            margin: 0 auto;
        }

        .back-button {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 25px;

            color: white;
            background: transparent;

            border: 1px solid white;
            border-radius: 6px;

            text-decoration: none;

            transition: 0.3s;
        }

        .back-button:hover {
            background: white;
            color: black;
        }
    </style>
</head>

<body>

    <div class="demo-container">

        <h1>SplitEase - Demo</h1>

        <p>
            Collaborative Split Bill Android Application
        </p>

        <video controls>
            <source src="./assets/vid/demo splitEase.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>

        <a href="projects.html" class="back-button">
            Back to Projects
        </a>

    </div>

</body>

</html>
